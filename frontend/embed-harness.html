<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer — validation montage isolé (CCTP 51C-2)</title>
    <!-- Feuille de style auto-contenue du bundle embed -->
    <link rel="stylesheet" href="/explorer/public/embed/style.css" />
    <style>
      /* Chrome factice simulant le layout hôte (dashboard) autour du <div> monté */
      body { margin: 0; font-family: sans-serif; }
      .host-header { background:#2a9d8f; color:#fff; padding:12px 20px; font-weight:600; }
      .host-body { display:flex; }
      .host-side { width:200px; background:#f0f0f0; padding:16px; min-height:80vh; }
      .host-main { flex:1; padding:16px; }
      .host-tools { padding:8px 16px; background:#fff3cd; border-bottom:1px solid #ffe08a; }
      button { margin-right:8px; }
    </style>
  </head>

  <body>
    <div class="host-header">Hôte factice (simule le layout dashboard) — le module Explorer est monté in-layout, sans iframe</div>
    <div class="host-tools">
      <button id="btn-mount">mount()</button>
      <button id="btn-unmount">unmount()</button>
      <span id="status">prêt</span>
    </div>
    <div class="host-body">
      <aside class="host-side">Menu hôte<br />(reste du layout)</aside>
      <main class="host-main">
        <!-- Cible de montage réservée par l'hôte : Explorer (React 18 isolé) s'y greffe -->
        <div id="embed-slot" data-explorer-config></div>
      </main>
    </div>

    <script>
      // Config identique à la vue backend explorer (instance « blog »).
      var WORFLOW_ACCESS = 'org.entcore.blog.controllers.BlogController|blog';
      var WORKFLOW_CREATE = 'org.entcore.blog.controllers.BlogController|create';
      var WORKFLOW_CREATE_PUBLIC = 'org.entcore.blog.controllers.BlogController|createPublicBlog';
      var WORKFLOW_PRINT = 'org.entcore.blog.controllers.BlogController|print';
      var WORKFLOW_PUBLISH = 'org.entcore.blog.controllers.BlogController|publish';
      var explorerConfig = {
        app: 'blog',
        types: ['blog'],
        enableOnboarding: false,
        filters: [
          { id: 'owner', defaultValue: true },
          { id: 'public', defaultValue: false },
          { id: 'shared', defaultValue: true },
        ],
        orders: [
          { id: 'name', defaultValue: 'asc', i18n: 'explorer.sorts.name' },
          { id: 'updatedAt', i18n: 'explorer.sorts.updatedat' },
        ],
        actions: [
          { id: 'open', workflow: WORFLOW_ACCESS, target: 'actionbar', right: 'read' },
          { id: 'share', workflow: WORFLOW_ACCESS, target: 'actionbar', right: 'manager' },
          { id: 'edit', workflow: WORFLOW_ACCESS, target: 'actionbar', right: 'manager' },
          { id: 'create', workflow: WORKFLOW_CREATE, target: 'tree' },
          { id: 'createPublic', workflow: WORKFLOW_CREATE_PUBLIC, target: 'tree' },
          { id: 'move', workflow: WORFLOW_ACCESS, target: 'actionbar', right: 'read' },
          { id: 'publish', workflow: WORKFLOW_PUBLISH, target: 'actionbar', right: 'creator' },
          { id: 'print', workflow: WORKFLOW_PRINT, target: 'actionbar', right: 'read' },
          { id: 'delete', workflow: WORFLOW_ACCESS, target: 'actionbar', right: 'read' },
        ],
        trashActions: [
          { id: 'restore', available: true, target: 'actionbar', workflow: '', right: 'manager' },
          { id: 'delete', available: true, target: 'actionbar', workflow: '', right: 'manager' },
        ],
      };
      document
        .querySelector('[data-explorer-config]')
        .setAttribute('data-explorer-config', JSON.stringify(explorerConfig));
    </script>

    <!-- Chargement dynamique du bundle isolé : l'hôte importe puis pilote mount/unmount -->
    <script type="module">
      const slot = document.getElementById('embed-slot');
      const status = document.getElementById('status');
      const mod = await import('/explorer/public/embed/explorer.js');
      const doMount = () => { mod.mount(slot, { embedded: true }); status.textContent = 'monté (React 18 isolé)'; };
      const doUnmount = () => { mod.unmount(slot); status.textContent = 'démonté'; };
      document.getElementById('btn-mount').addEventListener('click', doMount);
      document.getElementById('btn-unmount').addEventListener('click', doUnmount);
      doMount(); // montage automatique au chargement
    </script>
  </body>
</html>
