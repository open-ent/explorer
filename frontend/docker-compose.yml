services:
  node:
    image: node:26-alpine
    # Node ≥ 25 n'embarque plus corepack : pnpm (version du packageManager) est installé au
    # démarrage, à la place de l'image opendigitaleducation/node:*-pnpm.
    entrypoint: ["sh", "-c", "npm i -g --prefix /tmp/pnpm \"$$(node -p \"require('./package.json').packageManager.split('+')[0]\")\" >/dev/null && PATH=/tmp/pnpm/bin:$$PATH exec \"$$@\"", "--"]
    environment:
      - TIPTAP_PRO_TOKEN=${TIPTAP_PRO_TOKEN}
    user: 'node'
    working_dir: /home/node/app
    network_mode: host
    volumes:
      - ./:/home/node/app
      - ~/.pnpm:/.pnpm
      - ~/.npm:/.npm
      - ~/.cache:/.cache
